<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Қонжықтың орындығын тап — 20 тапсырма</title><style>
*{box-sizing:border-box}body{margin:0;font-family:'Times New Roman',serif;background:linear-gradient(145deg,#fff5d1,#dff3ff);color:#12367e;text-align:center}header{background:#ffbf38;border-bottom:5px solid #f39b13;padding:9px}h1{margin:0;font-size:clamp(27px,4vw,52px)}main{max-width:1250px;margin:auto;padding:10px}.progress{font-size:clamp(23px,3vw,35px);font-weight:bold}.hint{font-size:clamp(18px,2.5vw,29px);font-weight:bold;margin:7px auto 12px}.chairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.chairbox{position:relative;min-height:260px;background:#fffdf7;border:4px solid #3095dc;border-radius:22px;cursor:pointer;touch-action:none;user-select:none;overflow:hidden;display:flex;justify-content:center;align-items:center}.chairbox:nth-child(2){border-color:#ef9c3a}.chairbox:nth-child(3){border-color:#55a967}.chairbox img{height:240px;max-width:95%;object-fit:contain;pointer-events:none}.expression{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:64%;font-size:clamp(23px,3.3vw,44px);font-weight:900;white-space:nowrap;color:#122b75;pointer-events:none}.chairbox.correct{border-color:#21b350;background:#e8ffe9}.chairbox.wrong{animation:shake .23s 2;border-color:#e24d52}@keyframes shake{50%{transform:translateX(9px)}}.beararea{margin:12px auto 0;max-width:350px;min-height:240px;border:4px dashed #6bb2df;border-radius:25px;background:#ffffffa6;position:relative;display:flex;justify-content:center;align-items:center}.bearwrap{position:relative;display:inline-block;touch-action:none;cursor:grab;user-select:none}.bearwrap img{height:220px;width:auto;max-width:90vw;pointer-events:none}.bearnum{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);font-size:clamp(34px,4.8vw,59px);font-weight:900;color:#111;text-shadow:1px 2px 2px white;pointer-events:none}.feedback{min-height:42px;font-size:clamp(23px,3vw,37px);font-weight:bold;color:#138331}.next{display:none;background:#ffdd4c;border:3px solid #2d7aca;border-radius:16px;font: bold clamp(22px,3vw,34px) 'Times New Roman';color:#17387b;padding:9px 24px;cursor:pointer}.next.show{display:inline-block}.seatedwrap{position:absolute;z-index:3;width:57%;height:69%;left:50%;bottom:5%;transform:translateX(-50%);animation:pop .35s ease-out;pointer-events:none}.seatedbear{width:100%;height:100%;object-fit:contain;display:block}.seatednum{position:absolute;z-index:4;left:50%;top:76%;transform:translate(-50%,-50%);font-size:clamp(24px,3.1vw,42px);font-weight:900;color:#101010;text-shadow:0 1px 2px white,1px 0 white;white-space:nowrap}@keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}.dragghost{position:fixed;z-index:900;pointer-events:none;width:110px;opacity:.9;transform:translate(-50%,-50%)}canvas{position:fixed;inset:0;pointer-events:none;z-index:1000}footer{font-size:17px;padding:8px}@media(max-width:650px){.chairs{gap:5px}.chairbox{min-height:170px;border-width:3px;border-radius:12px}.chairbox img{height:158px}.expression{font-size:clamp(17px,5vw,25px);top:13%;width:90%}.beararea{min-height:180px;max-width:250px}.bearwrap img{height:165px}.bearnum{font-size:39px}.seatednum{font-size:clamp(16px,4vw,25px)}.seatedwrap{width:80%;height:68%}.hint{font-size:19px}}
</style></head><body><header><h1>🧸 ҚОНЖЫҚТЫҢ ОРЫНДЫҒЫН ТАП!</h1></header><main><div class="progress" id="progress"></div><p class="hint">Қонжықтағы санға тең өрнекті тап! Қонжықты орындыққа сүйре немесе дұрыс орындықты бас.</p><section class="chairs" id="chairs"></section><section class="beararea" id="beararea"><div class="bearwrap" id="bear" role="button" tabindex="0" aria-label="Қонжықты сүйре"><img src="bear.png" alt="Қонжық"><span class="bearnum" id="bearnum"></span></div></section><div class="feedback" id="feedback" aria-live="polite"></div></main><footer>20 тапсырма · 20 көлемінде тек қосу</footer><canvas id="fx"></canvas><script>
const tasks=[['8 + 4',12],['7 + 6',13],['9 + 8',17],['6 + 9',15],['8 + 7',15],['9 + 5',14],['7 + 8',15],['6 + 8',14],['9 + 7',16],['8 + 9',17],['5 + 7',12],['9 + 4',13],['7 + 9',16],['6 + 7',13],['8 + 6',14],['5 + 9',14],['7 + 7',14],['9 + 9',18],['8 + 8',16],['6 + 6',12]];
const $=id=>document.getElementById(id);let idx=0,solved=false,audioCtx;const random=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function sound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let t=audioCtx.currentTime;[523,659,784,1047,1318].forEach((f,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.105);g.gain.exponentialRampToValueAtTime(.13,t+i*.105+.025);g.gain.exponentialRampToValueAtTime(.001,t+i*.105+.24);o.connect(g).connect(audioCtx.destination);o.start(t+i*.105);o.stop(t+i*.105+.25)})}catch(e){}}
const cv=$('fx'),ctx=cv.getContext('2d');function fireworks(){cv.width=innerWidth;cv.height=innerHeight;let particles=[];for(let c=0;c<4;c++){let cx=innerWidth*(.18+c*.21),cy=innerHeight*(.22+Math.random()*.25);for(let i=0;i<40;i++){let a=Math.random()*Math.PI*2,s=2+Math.random()*7;particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70,color:`hsl(${Math.random()*360},100%,55%)`})}}function frame(){ctx.clearRect(0,0,cv.width,cv.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,6)});particles=particles.filter(p=>p.life>0);if(particles.length)requestAnimationFrame(frame)}frame()}
function render(){solved=false;$('progress').textContent=`${idx+1} / 20 тапсырма`;$('bearnum').textContent=tasks[idx][1];$('beararea').style.visibility='visible';$('feedback').textContent='';let correct=tasks[idx][0],answer=tasks[idx][1];let others=random([...new Set(tasks.filter((t,i)=>i!==idx&&t[1]!==answer).map(t=>t[0]))]).slice(0,2);let opts=random([correct,...others]);$('chairs').innerHTML='';opts.forEach(ex=>{let el=document.createElement('div');el.className='chairbox';el.dataset.expr=ex;el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',ex);el.innerHTML=`<img src="chair.png" alt="Сары орындық"><span class="expression">${ex}</span>`;el.addEventListener('click',()=>choose(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el)}});$('chairs').appendChild(el)})}
function choose(el){if(solved)return;if(el.dataset.expr!==tasks[idx][0]){el.classList.add('wrong');$('feedback').style.color='#bb3041';$('feedback').textContent='Қайта ойланып көр!';setTimeout(()=>{el.classList.remove('wrong');if(!solved)$('feedback').textContent=''},850);return}solved=true;el.classList.add('correct');$('beararea').style.visibility='hidden';let wrap=document.createElement('div');wrap.className='seatedwrap';let bear=document.createElement('img');bear.src='bear.png';bear.className='seatedbear';bear.alt='Орындыққа отырған қонжық';let n=document.createElement('span');n.className='seatednum';n.textContent=tasks[idx][1];wrap.append(bear,n);el.append(wrap);$('feedback').style.color='#148a36';$('feedback').textContent='🎉 Дұрыс!';sound();fireworks();setTimeout(()=>{if(idx===19){$('feedback').textContent='🎉 Барлық 20 тапсырманы орындадың!';$('beararea').style.visibility='visible';$('bearnum').textContent='★';$('beararea').onclick=()=>{idx=0;render();$('beararea').onclick=null};}else{idx++;render()}},2400)}
let drag=null,ghost=null;const bear=$('bear');bear.addEventListener('pointerdown',e=>{if(solved)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};bear.setPointerCapture(e.pointerId)});bear.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(!ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7){ghost=document.createElement('img');ghost.src='bear.png';ghost.className='dragghost';document.body.appendChild(ghost)}if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}});bear.addEventListener('pointerup',e=>{if(!drag)return;if(ghost){let choice=[...document.querySelectorAll('.chairbox')].find(el=>{let r=el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});if(choice)choose(choice);ghost.remove();ghost=null}drag=null});bear.addEventListener('pointercancel',()=>{if(ghost)ghost.remove();ghost=null;drag=null});render();
</script></body></html>
